<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Add to Home Screen on iPad launches this without Safari's chrome, which is the
     whole point of the PWA. The status bar picks up the page background, so the
     theme-colour pair must match Palette's page colour in both appearances. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Family Tree">
<meta name="theme-color" content="#F4EFE7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1C19" media="(prefers-color-scheme: dark)">
<title>Family Tree — Viewer</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --page:#F4EFE7; --card:#FDFCF9; --ink:#2B2621; --secondary:#847A6F;
    --muted:#A89C8C; --accent:#8A3D4D; --accent-soft:#EFE2E4; --border:#E7DFD0;
    --hairline:#E0D5C2; --connector:#C7BAA5; --male:#5F7C9E; --female:#BE6076; --neutral:#9B9083;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --shadow:0 1px 2px rgba(43,38,33,.05),0 6px 20px rgba(43,38,33,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page:#1F1C19; --card:#2A2622; --ink:#ECE5DB; --secondary:#ACA093;
      --muted:#817668; --accent:#D3899A; --accent-soft:#3E2B31; --border:#3A352F;
      --hairline:#423B33; --connector:#565049; --male:#89A6C4; --female:#DE97A8; --neutral:#8C8173;
      --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 20px rgba(0,0,0,.30);
    }
  }
  :root[data-theme="light"] {
    --page:#F4EFE7; --card:#FDFCF9; --ink:#2B2621; --secondary:#847A6F;
    --muted:#A89C8C; --accent:#8A3D4D; --accent-soft:#EFE2E4; --border:#E7DFD0;
    --hairline:#E0D5C2; --connector:#C7BAA5; --male:#5F7C9E; --female:#BE6076; --neutral:#9B9083;
    --shadow:0 1px 2px rgba(43,38,33,.05),0 6px 20px rgba(43,38,33,.06);
  }
  :root[data-theme="dark"] {
    --page:#1F1C19; --card:#2A2622; --ink:#ECE5DB; --secondary:#ACA093;
    --muted:#817668; --accent:#D3899A; --accent-soft:#3E2B31; --border:#3A352F;
    --hairline:#423B33; --connector:#565049; --male:#89A6C4; --female:#DE97A8; --neutral:#8C8173;
    --shadow:0 1px 2px rgba(0,0,0,.25),0 6px 20px rgba(0,0,0,.30);
  }

  * { box-sizing:border-box; }
  html,body { height:100%; }
  body {
    margin:0; background:var(--page); color:var(--ink);
    font-family:var(--sans); font-size:16px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .app { display:grid; grid-template-columns:300px 1fr; height:100vh; }

  /* ---- Sidebar: person list ---- */
  .sidebar {
    background:var(--card); border-right:1px solid var(--border);
    display:flex; flex-direction:column; min-height:0;
  }
  .brand { padding:18px 18px 12px; }
  .brand h1 { margin:0; font-size:15px; letter-spacing:.02em; }
  .brand .sub { color:var(--muted); font-size:12px; margin-top:2px; }
  .search {
    margin:0 14px 10px; padding:8px 12px; border:1px solid var(--border);
    border-radius:9px; background:var(--page); color:var(--secondary);
    font-size:13px; display:flex; align-items:center; gap:8px;
  }
  .search:focus-within { border-color:var(--accent); }
  .search svg { width:14px; height:14px; opacity:.6; flex:0 0 auto; }
  .search input {
    border:0; padding:0; background:transparent; color:var(--ink);
    font-family:inherit; font-size:13px; width:100%; min-width:0; outline:none;
  }
  .search input::placeholder { color:var(--secondary); }

  /* ---- Import (file picker → unzip → IndexedDB) ---- */
  .importRow { margin:2px 14px 0; }
  .importBtn {
    width:100%; border:1px solid var(--border); background:var(--page); color:var(--ink);
    font-family:inherit; font-size:12.5px; font-weight:500; cursor:pointer;
    border-radius:8px; padding:7px 10px;
  }
  .importBtn:hover { border-color:var(--accent); color:var(--accent); }
  .importBtn:disabled { opacity:.6; cursor:default; }
  .importStatus { font-size:11.5px; color:var(--muted); margin:7px 14px 0; line-height:1.4; }
  .importStatus.error { color:var(--accent); }
  .importStatus:empty { display:none; }

  .people { overflow-y:auto; padding:4px 8px 16px; min-height:0; }
  .group-label {
    font-size:11px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--muted); padding:12px 10px 6px;
  }
  .prow {
    display:flex; align-items:center; gap:11px; padding:8px 10px;
    border-radius:10px; cursor:pointer; text-decoration:none; color:inherit;
  }
  .prow:hover { background:var(--page); }
  .prow.active { background:var(--accent-soft); }
  .prow.active .pname { color:var(--accent); font-weight:600; }
  .pname { font-size:14px; line-height:1.2; }
  .pyears { font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; margin-top:1px; }
  .noresults { color:var(--muted); font-size:13px; padding:16px 10px; }

  /* ---- Monogram avatars (whole badge tinted by sex, like the app) ---- */
  .mono {
    --tint:var(--neutral);
    flex:0 0 auto; display:grid; place-items:center; border-radius:50%;
    color:var(--tint); font-weight:600; letter-spacing:.02em;
    background:color-mix(in srgb, var(--tint) 18%, transparent);
    box-shadow:inset 0 0 0 1.5px color-mix(in srgb, var(--tint) 42%, transparent);
  }
  .mono.sm { width:34px; height:34px; font-size:12px; }
  .mono.md { width:44px; height:44px; font-size:15px; }
  .mono.lg { width:76px; height:76px; font-size:26px; }
  .mono.male   { --tint:var(--male); }
  .mono.female { --tint:var(--female); }
  /* A profile photo fills the same badge as the monogram it replaces — same
     ring, same size classes — so the header/list layout needs no branching. */
  .mono.photo { overflow:hidden; background:var(--card); }
  /* contain, not cover: shows the whole photo, letterboxed against the
     badge's own background rather than cropped. No crop-position guess can
     work for every photo (tried biasing the crop toward the top — helped
     some, clipped others), so this trades a fully-filled circle for a
     guarantee that no one's face is ever cut off. */
  .mono.photo img { width:100%; height:100%; object-fit:contain; display:block; }

  /* ---- Detail column ---- */
  .detail { overflow-y:auto; min-height:0; }
  .sheet { max-width:720px; margin:0 auto; padding:34px 28px 64px; }

  /* ---- Cards ----
     The identity header, Life Story and Timeline each sit on a card, as on the
     Mac app's Details page. Family and Sources deliberately do NOT get one: their
     contents are already cards (person chips, one mini card per source) and
     wrapping cards in a card only doubles the borders. */
  .card {
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:20px 22px; box-shadow:var(--shadow);
  }
  .idhead { display:flex; gap:20px; align-items:center; }
  .idhead h2 { margin:0; font-size:27px; line-height:1.12; letter-spacing:-.01em; text-wrap:balance; }
  .idhead .life { color:var(--secondary); font-size:16px; margin-top:5px; font-variant-numeric:tabular-nums; }
  .idhead .whereline { color:var(--muted); font-size:14px; margin-top:3px; }

  /* Cards carry their own visual separation, so the old 34px gap between bare
     sections is now too much air. */
  section.block { margin-top:18px; }
  .label {
    font-size:12px; text-transform:uppercase; letter-spacing:.1em;
    color:var(--accent); font-weight:600; margin:0 0 14px;
    padding-bottom:8px; border-bottom:1px solid var(--hairline);
  }
  .thin { color:var(--muted); font-size:14px; }

  /* ---- Life story prose ---- */
  .story { font-family:var(--serif); font-size:18px; line-height:1.66; color:var(--ink); }
  .story p { margin:0 0 1.05em; max-width:62ch; }
  .story p:last-child { margin-bottom:0; }

  /* ---- Timeline ----
     The spine is drawn per event (dot → next dot), not as one bar down the
     whole list, so it starts at the first dot and stops at the last one
     instead of hanging past it. All the geometry derives from --dot / --spine
     / --axis, so the dot and the line can't drift apart. */
  .timeline { --dot:11px; --spine:2px; --axis:20px; position:relative; margin-left:6px; padding-left:26px; }
  .tl {
    /* The dot marks the EVENT, so it centres on the bold event line rather
       than the year eyebrow above it: clear the year's line box (13px × 1.5)
       and .ev's margin, then centre the dot in .ev's line box (15px × 1.5). */
    --dot-top:calc(13px * 1.5 + 1px + (15px * 1.5 - var(--dot)) / 2);
    position:relative; padding:0 0 20px;
  }
  .tl:last-child { padding-bottom:0; }
  .tl::before {                        /* the event's dot */
    content:""; position:absolute; top:var(--dot-top);
    left:calc((var(--axis) + var(--dot) / 2) * -1);
    width:var(--dot); height:var(--dot); border-radius:50%; background:var(--accent);
  }
  .tl::after {                         /* spine segment down to the next dot */
    content:""; position:absolute;
    left:calc((var(--axis) + var(--spine) / 2) * -1);
    top:calc(var(--dot-top) + var(--dot)); bottom:calc(var(--dot-top) * -1);
    width:var(--spine); background:var(--hairline);
  }
  .tl:last-child::after { content:none; }
  .tl .yr {
    /* Always reserves a line box, even for an undated event (empty text) —
       an empty block collapses to 0 height, which would silently invalidate
       --dot-top above and drop every dot/spine on that row out of place. */
    min-height:calc(13px * 1.5);
    font-size:13px; line-height:1.5; color:var(--muted); font-variant-numeric:tabular-nums;
  }
  .tl .ev { font-size:15px; margin-top:1px; }
  .tl .ev b { font-weight:600; }
  .tl .ev .place { color:var(--secondary); }
  /* An event's note gets the same boxed "mini insert" treatment as a source's
     transcription (.transcription, below) — both are free-text research notes,
     and rendering one plain and one boxed read as inconsistent, not intentional. */

  /* ---- Family ---- */
  .subhead { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--secondary); margin:18px 0 8px; }
  .subhead:first-child { margin-top:0; }
  .union-meta { color:var(--muted); font-size:13px; font-weight:400; text-transform:none; letter-spacing:0; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip {
    display:flex; align-items:center; gap:9px; padding:6px 12px 6px 6px;
    background:var(--card); border:1px solid var(--border); border-radius:999px;
    text-decoration:none; color:inherit; box-shadow:var(--shadow);
  }
  .chip:hover { border-color:var(--accent); }
  .chip .pname { font-size:13px; }
  .chip .pyears { font-size:11px; }

  /* ---- Sources ---- */
  /* One mini card per source — a long shared card buries where each record ends. */
  .source { border:1px solid var(--border); border-radius:12px; background:var(--card); padding:16px 18px; margin-bottom:12px; box-shadow:var(--shadow); }
  .source:last-child { margin-bottom:0; }
  .source h3 { margin:0; font-size:15px; }
  .source .repo { color:var(--muted); font-size:13px; margin-top:2px; }
  .record { margin-top:12px; padding-top:12px; border-top:1px solid var(--hairline); }
  .record.compact { margin-top:4px; padding-top:0; border-top:none; }
  .record .cite { font-size:13px; color:var(--secondary); }
  .record a { color:var(--accent); text-decoration:none; }
  .record a:hover { text-decoration:underline; }
  .transcription {
    font-family:var(--serif); font-size:15px; line-height:1.55; color:var(--ink);
    margin-top:8px; padding:11px 14px; background:var(--page);
    border-left:3px solid var(--accent-soft); border-radius:0 8px 8px 0;
    white-space:pre-line;   /* notes are typed with real line breaks; keep them */
  }
  /* The "AI summary:" style scaffolding line — present, but not the thing to read. */
  .transcription .note-label {
    display:block; font-family:var(--sans); font-size:11px; letter-spacing:.07em;
    text-transform:uppercase; color:var(--muted); margin-bottom:6px;
  }

  /* ---- Photos & Documents ---- */
  .mgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:10px; }
  .mtile {
    position:relative; aspect-ratio:1; padding:0; border:1px solid var(--border);
    border-radius:10px; overflow:hidden; background:var(--page); cursor:pointer;
  }
  .mtile:hover { border-color:var(--accent); }
  .mtile img { width:100%; height:100%; object-fit:cover; display:block; }
  .mbadge {
    position:absolute; right:5px; bottom:5px; font-size:9.5px; font-weight:600;
    letter-spacing:.04em; padding:2px 6px; border-radius:5px;
    background:rgba(20,17,14,.62); color:#fff;
  }

  /* ---- Lightbox: tap a Photos & Documents tile for a full-size look ---- */
  .lightbox {
    position:fixed; inset:0; z-index:50; background:rgba(20,17,14,.72);
    display:flex; align-items:center; justify-content:center; padding:5vh 5vw;
  }
  .lightbox[hidden] { display:none; }
  .lightboxBody { max-width:min(90vw, 720px); max-height:90vh; display:flex; flex-direction:column; align-items:center; gap:12px; }
  .lightboxBody img { max-width:100%; max-height:72vh; border-radius:10px; box-shadow:0 10px 40px rgba(0,0,0,.4); }
  .lightboxCaption { color:#F4EFE7; font-size:14px; text-align:center; }
  .lightboxCaption a { color:#F4EFE7; text-decoration:underline; }
  .lightboxClose {
    position:absolute; top:18px; right:18px; width:38px; height:38px; border-radius:50%;
    border:1px solid rgba(255,255,255,.35); background:rgba(20,17,14,.5); color:#fff;
    font-size:18px; line-height:1; cursor:pointer;
  }
  .lightboxClose:hover { border-color:#fff; }

  footer.credit {
    margin-top:44px; padding-top:16px; border-top:1px solid var(--hairline);
    color:var(--muted); font-size:12px; display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
  }
  .pill {
    display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px;
    background:var(--accent-soft); color:var(--accent); letter-spacing:.02em;
  }

  /* ---- schemaVersion guard: a bundle this viewer can't read ---- */
  .guard { max-width:520px; margin:12vh auto; padding:26px 28px; text-align:center;
           border:1px solid var(--border); border-radius:14px; background:var(--card); box-shadow:var(--shadow); }
  .guard h2 { margin:0 0 8px; font-size:19px; }
  .guard p { margin:0; color:var(--secondary); font-size:14px; }

  a { color:var(--accent); }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:6px; }

  /* ---- Top bar with the People toggle (shown at all widths) ---- */
  .topbar {
    display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:10;
    padding:10px 14px; background:var(--page); border-bottom:1px solid var(--border);
  }
  .topttl { font-size:14px; font-weight:600; }
  .scrim { display:none; }
  .menuBtn {
    border:1px solid var(--border); background:var(--card); color:var(--ink);
    font-family:var(--sans); font-size:14px; font-weight:500; cursor:pointer;
    border-radius:9px; padding:7px 12px; display:inline-flex; align-items:center; gap:7px;
  }
  .menuBtn:hover { border-color:var(--accent); }
  .viewToggle {
    margin-left:auto; border:1px solid var(--border); background:var(--card); color:var(--ink);
    font-family:var(--sans); font-size:13px; font-weight:500; cursor:pointer;
    border-radius:9px; padding:7px 12px;
  }
  .viewToggle:hover { border-color:var(--accent); }

  /* ---- Family Explorer ----
     An hourglass centred on a focus person: ancestors fan up, descendants fan
     down, each branch expanded/collapsed by tapping ⊕/⊖. Ported from the Mac
     app's FamilyExplorer.swift (see pwa-viewer/DESIGN.md). Connectors are one
     SVG path (crisp at any zoom); cards are plain buttons positioned in the
     same unscaled coordinate space, so no separate hit-testing math is needed. */
  .explore { display:none; flex:1 1 auto; min-height:0; flex-direction:column; }
  body.explore-mode .detail { display:flex; flex-direction:column; overflow:hidden; }
  body.explore-mode .sheet { display:none; }
  body.explore-mode .explore { display:flex; }
  .explore-toolbar {
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    padding:10px 14px; border-bottom:1px solid var(--border); flex:0 0 auto;
  }
  .explore-focus { font-size:13px; }
  .explore-hint { font-size:12px; color:var(--muted); }
  .spacer { flex:1 1 auto; }
  .xbtn {
    border:1px solid var(--border); background:var(--card); color:var(--ink);
    font-family:var(--sans); font-size:13px; cursor:pointer; border-radius:8px;
    padding:6px 11px; font-variant-numeric:tabular-nums;
  }
  .xbtn:hover:not(:disabled) { border-color:var(--accent); }
  .xbtn:disabled { opacity:.4; cursor:default; }
  .zoomPctBtn { min-width:52px; }
  /* Native scroll (one-finger pan) is left entirely to the browser; JS only
     intervenes for two-finger pinch and ctrl-wheel (trackpad pinch), both
     `preventDefault()`ed explicitly so they don't fight the native pan. */
  .explore-viewport {
    flex:1 1 auto; min-height:0; overflow:auto; position:relative;
    background:var(--page); -webkit-overflow-scrolling:touch; touch-action:pan-x pan-y;
  }
  .explore-sizer { position:relative; }
  .explore-canvas { position:relative; transform-origin:top left; }
  .explore-lines { position:absolute; top:0; left:0; }
  .xcard {
    position:absolute; display:flex; align-items:center; gap:8px; padding:7px;
    box-sizing:border-box; background:var(--card); border:1px solid var(--border);
    border-radius:9px; box-shadow:var(--shadow); text-align:left; cursor:pointer;
    font-family:var(--sans); color:inherit; overflow:hidden;
  }
  .xcard:hover { border-color:var(--accent); }
  /* The focus card glows in the claret accent; a married-in spouse gets a
     dashed border — exactly the native ExplorerCard's rules. */
  .xcard.focus { background:color-mix(in srgb, var(--accent) 10%, var(--card)); border-color:var(--accent); border-width:2px; }
  .xcard.spouse { border-style:dashed; }
  .xcard .bar { --tint:var(--neutral); width:3px; align-self:stretch; border-radius:1.5px; flex:0 0 auto; background:var(--tint); }
  .xcard .bar.male { --tint:var(--male); }
  .xcard .bar.female { --tint:var(--female); }
  .xinfo { min-width:0; }
  .xname {
    font-size:13px; font-weight:600; line-height:1.25; display:-webkit-box;
    -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .xyears { font-size:11px; color:var(--muted); margin-top:1px; font-variant-numeric:tabular-nums; }
  .xhandle {
    position:absolute; width:26px; height:26px; border-radius:50%;
    background:var(--page); border:1px solid var(--border); display:grid; place-items:center;
    cursor:pointer; color:var(--accent);
  }
  .xhandle.expanded { color:var(--muted); }
  .xhandle:hover { border-color:var(--accent); }

  /* ---- Wide (iPad / desktop): sidebar is an in-flow column you can collapse ---- */
  @media (min-width:701px) {
    body.nav-collapsed .app { grid-template-columns:1fr; }
    body.nav-collapsed .sidebar { display:none; }
  }

  /* ---- Narrow (phone / Split View): sidebar slides in over the page ---- */
  @media (max-width:700px) {
    .app { grid-template-columns:1fr; }
    .sidebar {
      position:fixed; top:0; left:0; bottom:0; width:290px; z-index:30;
      transform:translateX(-100%); transition:transform .25s ease;
      box-shadow:0 0 40px rgba(0,0,0,.25);
    }
    body.nav-open .sidebar { transform:none; }
    .scrim { position:fixed; inset:0; z-index:20; background:rgba(20,17,14,.38); }
    body.nav-open .scrim { display:block; }
    .sheet { padding:22px 18px 56px; }
    .idhead h2 { font-size:23px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sidebar { transition:none; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ============ Sidebar ============ -->
  <aside class="sidebar">
    <div class="brand">
      <h1 id="treeName">Family Tree</h1>
      <div class="sub" id="treeSub">read-only</div>
    </div>
    <label class="search" for="searchBox">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
      <input id="searchBox" type="search" placeholder="Search people" autocomplete="off" spellcheck="false">
    </label>
    <div class="importRow">
      <button class="importBtn" id="importBtn" type="button">Import a tree…</button>
      <input type="file" id="importFile" accept=".familyweb,.zip" hidden>
    </div>
    <div class="importStatus" id="importStatus"></div>
    <nav class="people" id="peopleNav"></nav>
  </aside>

  <!-- Scrim behind the slide-in list on narrow screens -->
  <div class="scrim" id="scrim"></div>

  <!-- ============ Detail ============ -->
  <main class="detail" id="detail">
    <div class="topbar">
      <button class="menuBtn" id="menuBtn" aria-label="Show people list">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
        People
      </button>
      <span class="topttl" id="topTitle">Family Tree</span>
      <button class="viewToggle" id="viewToggle" type="button"></button>
    </div>
    <div class="sheet" id="sheet"></div>

/* A spouse family is a marriage ONLY when it carries a MARR event. */
const marriage = fam => fam.events.find(e => e.tag === "MARR") || null;

/* ---- Media: resolving a `thumb` path to something an <img> can load. An
   imported bundle's images live as Blobs in IndexedDB, keyed by their path
   inside the .familyweb (openDB/idbGet are defined down in Import); the dev
   tree.json path and the fixture just use an ordinary URL — a sibling img/
   file, or a data: URI — that the browser fetches directly. Same rendering
   code handles either; callers never know which. */
let mediaDB = null;
const mediaCache = new Map(); // path -> resolved src (blob: URL or the original path)

async function resolveMediaSrc(path) {
  if (mediaCache.has(path)) return mediaCache.get(path);
  let src = path;
  try {
    if (!mediaDB) mediaDB = await openDB();
    const blob = await idbGet(mediaDB, "media", path);
    if (blob) src = URL.createObjectURL(blob);
  } catch (e) { /* IndexedDB unavailable — fall back to the raw path */ }
  mediaCache.set(path, src);
  return src;
}

/* Call after inserting any HTML that may contain `<img data-media-path>` —
   resolves each one and swaps it in. Runs after the fact (rather than
   inline) because IndexedDB is async and the rest of the app renders
   synchronously via innerHTML. A load failure (a stale blob: URL from a
   since-replaced import, say) demotes a header/list avatar back to its
   monogram rather than showing a broken-image glyph. */
function hydrateMedia(container) {
  container.querySelectorAll("img[data-media-path]").forEach(img => {
    resolveMediaSrc(img.dataset.mediaPath).then(src => { img.src = src; }).catch(() => {});
    img.addEventListener("error", () => {
      const mono = img.closest(".mono.photo");
      if (mono) { mono.classList.remove("photo"); mono.textContent = mono.dataset.fallback || "?"; }
    }, { once: true });
  });
}

/* A profile photo fills the same badge the monogram would, at whatever size
   class the caller wants — the header's "lg" and the sidebar's "sm" share
   this one path, so a person's photo shows everywhere their initials would. */
function avatarHtml(p, sizeClass) {
  const photo = p.profilePhotoId && (p.media || []).find(m => m.id === p.profilePhotoId);
  if (!photo) return '<span class="mono ' + sizeClass + ' ' + sexClass(p) + '">' + esc(initials(p)) + '</span>';
  return '<span class="mono ' + sizeClass + ' ' + sexClass(p) + ' photo" data-fallback="' + esc(initials(p)) + '">' +
    '<img data-media-path="' + esc(photo.thumb) + '" alt=""></span>';
}

/* ---- Sidebar ------------------------------------------------------------ */

/* Alphabetical by surname initial, with a trailing "No surname" group —
   the web counterpart of PersonSectioning in the Mac app. */
function sections(people) {
  const groups = new Map(), unnamed = [];
  for (const p of people) {
    const initial = (p.surname || "").trim()[0];
    if (!initial) { unnamed.push(p); continue; }
    const key = initial.toUpperCase();
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(p);
  }
  const sorter = (a, b) =>
    (a.surname || "").localeCompare(b.surname || "") ||
    (a.givenName || "").localeCompare(b.givenName || "") ||
    ((a.birth && a.birth.year) || 0) - ((b.birth && b.birth.year) || 0);
  const out = [...groups.keys()].sort().map(k => ({ label:k, people:groups.get(k).sort(sorter) }));
  if (unnamed.length) out.push({ label:"No surname", people:unnamed.sort(sorter) });
  return out;
}

function personRow(p, cls) {
  return '<a class="' + cls + '" href="#' + esc(p.id) + '">' +
           avatarHtml(p, "sm") +
           '<span><span class="pname">' + esc(fullName(p)) + '</span>' +
           '<div class="pyears">' + esc(years(p)) + '</div></span></a>';
}

function renderSidebar() {
  const q = document.getElementById("searchBox").value.trim().toLowerCase();
  const matches = q ? TREE.people.filter(p => fullName(p).toLowerCase().includes(q)) : TREE.people;
  const nav = document.getElementById("peopleNav");
  if (!matches.length) {
    nav.innerHTML = '<div class="noresults">No one matches “' + esc(q) + '”.</div>';
    return;
  }
  nav.innerHTML = sections(matches).map(sec =>
    '<div class="group-label">' + esc(sec.label) + '</div>' +
    sec.people.map(p => personRow(p, "prow" + (p.id === currentId ? " active" : ""))).join("")
  ).join("");
  hydrateMedia(nav);
}

/* ---- Detail ------------------------------------------------------------- */

function renderHeader(p) {
  const age = ageAtDeath(p);
  const life = [years(p), age != null ? "aged " + age : null].filter(Boolean)
                 .join(" &nbsp;·&nbsp; ");
  const where = [
    p.birth && p.birth.place ? "Born " + esc(p.birth.place) : null,
    p.death && p.death.place ? "Died " + esc(p.death.place) : null
  ].filter(Boolean).join(" &nbsp;·&nbsp; ");
  return '<header class="idhead card">' +
    avatarHtml(p, "lg") +
    '<div><h2>' + esc(fullName(p)) + '</h2>' +
    (life  ? '<div class="life">' + life + '</div>' : "") +
    (where ? '<div class="whereline">' + where + '</div>' : "") +
    '</div></header>';
}

/* Carded sections put their label inside the card, above its hairline, as on the
   Mac app's Details page. Family and Sources are NOT carded: their contents are
   already cards (person chips, one mini card per source), and wrapping cards in a
   card just doubles the borders. */
function block(label, inner, carded) {
  return '<section class="block' + (carded ? " card" : "") + '">' +
         '<p class="label">' + esc(label) + '</p>' + inner + '</section>';
}

function renderStory(p) {
  if (!p.lifeStory || !p.lifeStory.length) return "";
  return block("Life Story",
    '<div class="story">' + p.lifeStory.map(t => "<p>" + esc(t) + "</p>").join("") + "</div>", true);
}

/* No client-side re-sort: the exporter already emits `timeline` in the Mac
   app's own order (Person.timeline / EventCatalog.isBeforeManual) — chronological,
   undated last, UNLESS the person has manually reordered events on the Mac, in
   which case that manual order wins. A naive re-sort by year here would silently
   undo a manual fix for any undated event, since year is all it has to go on. */
function renderTimeline(p) {
  if (!p.timeline || !p.timeline.length) return "";
  const rows = p.timeline
    .map(e =>
      '<div class="tl"><div class="yr">' + esc(e.date || "") + '</div>' +
      '<div class="ev"><b>' + esc(e.label) + '</b>' +
      (e.place ? ' · <span class="place">' + esc(e.place) + '</span>' : "") + '</div>' +
      (e.detail ? '<div class="transcription">' + esc(e.detail) + '</div>' : "") + '</div>')
    .join("");
  return block("Timeline", '<div class="timeline">' + rows + '</div>', true);
}

function chips(people) {
  return '<div class="chips">' + people.map(p => personRow(p, "chip")).join("") + '</div>';
}

function renderFamily(p) {
  let out = "";

  const parentFam = p.parentFamilyId && famById.get(p.parentFamilyId);
  if (parentFam) {
    const parents = [parentFam.husbandId, parentFam.wifeId].map(id => byId.get(id)).filter(Boolean);
    if (parents.length) out += '<div class="subhead">Parents</div>' + chips(parents);
  }

  for (const fid of p.spouseFamilyIds || []) {
    const fam = famById.get(fid); if (!fam) continue;
    const spouse = spouseIn(fam, p.id);
    const marr = marriage(fam);
    const who = spouse ? fullName(spouse) : "an unrecorded partner";
    /* The MARR rule again, in the section head: married vs. a relationship. */
    const heading = marr ? "Married " + esc(who) : "Relationship with " + esc(who);
    const meta = marr
      ? [marr.date, marr.place].filter(Boolean).join(", ")
      : "no marriage recorded";
    out += '<div class="subhead">' + heading +
           ' <span class="union-meta">— ' + esc(meta) + '</span></div>';
    if (spouse) out += chips([spouse]);

    const kids = (fam.childIds || []).map(id => byId.get(id)).filter(Boolean);
    if (kids.length) out += '<div class="subhead">Children</div>' + chips(kids);
  }

  if (!out) out = '<p class="thin">No family recorded for this person.</p>';
  return block("Family", out);
}

/* Mirrors the native "Photos & Documents" grid: every attachment, in the
   order the exporter emits them (Person.attachmentList — oldest first). A
   PDF's thumb is already a rendered first page (SCHEMA-v1.md), so it's shown
   exactly like a photo, just badged so "first page" reads as a first page
   and not the whole document. Tapping a tile opens it larger in the
   lightbox (wired in wireUI) rather than the native app's "open externally",
   since a read-only web viewer has nowhere else to open it to. */
function renderMedia(p) {
  if (!p.media || !p.media.length) return "";
  const tiles = p.media.map(m =>
    '<button type="button" class="mtile" data-full="' + esc(m.fullURL || "") + '" ' +
    'data-caption="' + esc(m.caption || "") + '" data-pages="' + esc(m.pages || "") + '" data-form="' + esc(m.form) + '">' +
    '<img data-media-path="' + esc(m.thumb) + '" alt="' + esc(m.caption || "") + '">' +
    (m.form === "pdf" ? '<span class="mbadge">PDF</span>' : "") +
    '</button>'
  ).join("");
  return block("Photos & Documents", '<div class="mgrid">' + tiles + '</div>', true);
}

function openLightbox(tile) {
  const tileImg = tile.querySelector("img");
  const img = document.getElementById("lightboxImg");
  img.src = tileImg.src;
  img.alt = tileImg.alt;
  const bits = [];
  if (tile.dataset.caption) bits.push(esc(tile.dataset.caption));
  if (tile.dataset.form === "pdf" && tile.dataset.pages) bits.push("First page of " + esc(tile.dataset.pages));
  if (tile.dataset.full) bits.push('<a href="' + esc(tile.dataset.full) + '" target="_blank" rel="noopener">Open original ↗</a>');
  document.getElementById("lightboxCaption").innerHTML = bits.join(" &nbsp;·&nbsp; ");
  document.getElementById("lightbox").hidden = false;
}
function closeLightbox() { document.getElementById("lightbox").hidden = true; }

function wireLightbox() {
  document.getElementById("sheet").addEventListener("click", e => {
    const tile = e.target.closest(".mtile");
    if (tile) openLightbox(tile);
  });
  document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
  document.getElementById("lightbox").addEventListener("click", e => {
    if (e.target.id === "lightbox") closeLightbox();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !document.getElementById("lightbox").hidden) closeLightbox();
  });
}

/* A person carries their OWN records (schema v1: person.sources = [{sourceId,
   records}]); sources[] is just the bibliography. Records used to hang off the
   shared source, which meant a person citing a big national collection rendered
   every record in the tree for it — see SCHEMA-v1.md. */
function renderSources(p) {
  const list = (p.sources || [])
    .map(entry => ({ source: srcById.get(entry.sourceId), records: entry.records || [] }))
    .filter(e => e.source);
  /* block() escapes its label, so pass a plain ampersand — "&amp;" here rendered
     as "SOURCES &AMP; RECORDS". */
  if (!list.length) return block("Sources & Records",
    '<p class="thin">No sources are cited for this person yet.</p>');
  const cards = list.map(({ source: s, records }) =>
    '<div class="source"><h3>' + esc(s.title || "Untitled source") + '</h3>' +
    /* The Details page's subtitle is the source's author; repository is set on a
       different subset. Plenty of sources carry the SAME string in both (every
       Ancestry-imported one), so show each distinct value once. */
    [...new Set([s.author, s.repository].filter(Boolean))]
      .map(line => '<div class="repo">' + esc(line) + '</div>').join("") +
    records.map((r, i) => {
      const link = r.url
        ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' +
          esc(hostOf(r.url)) + ' ↗</a>' : "";
      /* A citation can carry only a note, or nothing beyond the source itself —
         still its own record (each is individually a piece of evidence), but with
         no page or link there's nothing to show on this line. */
      const cite = r.page && link ? esc(r.page) + ' · ' + link
                 : r.page ? esc(r.page)
                 : link   ? link
                 : "";
      /* Notes and transcriptions are shown open — never behind a disclosure
         triangle. The exporter pre-splits the "AI summary:" style label. */
      const words = [
        r.note ? '<div class="transcription">' +
                 (r.note.label ? '<span class="note-label">' + esc(r.note.label) + '</span>' : "") +
                 esc(r.note.body) + '</div>' : "",
        r.text ? '<div class="transcription">' + esc(r.text) + '</div>' : ""
      ].join("");
      /* A hairline earns its keep separating a block of prose from its
         neighbours. Between two bare citations — just a page ref or a link,
         nothing to read — it's only visual noise, so skip it there. */
      const hasWords = !!(r.note || r.text);
      const prevHadWords = i > 0 && !!(records[i - 1].note || records[i - 1].text);
      const compact = i > 0 && !hasWords && !prevHadWords;
      return '<div class="record' + (compact ? " compact" : "") + '"><div class="cite">' + cite + '</div>' + words + '</div>';
    }).join("") +
    '</div>').join("");
  return block("Sources & Records", cards);
}

/* Bare host for a link label, e.g. "example.org". A malformed URL in the data
   must not take the whole page down with it. */
function hostOf(url) {
  try { return new URL(url).hostname.replace(/^www\./, ""); }
  catch (e) { return url; }
}

function renderFooter() {
  const when = new Date(importedAt || TREE.generatedAt).toLocaleDateString("en-GB",
    { day:"numeric", month:"short", year:"numeric" });
  return '<footer class="credit"><span>Imported from <b>' + esc(TREE.treeName) +
         '</b> · ' + esc(when) + '</span>' +
         (isSample ? '<span class="pill">sample data</span>' : "") +
         '<span class="pill">bundle schema v' + esc(TREE.schemaVersion) + '</span></footer>';
}

/* ============================================================================
   Family Explorer — hourglass tree browsing, ported from FamilyExplorer.swift
   / ExplorerExpansion.swift / ExplorerMetrics.swift (see DESIGN.md). No schema
   change was needed: layout consumes only parentFamilyId, spouseFamilyIds →
   childIds, husbandId/wifeId, and each person's own name/years/sex, all of
   which tree.json already carries. Expansion is interactive, so — like the
   Mac app — this is recomputed client-side rather than pre-baked by the
   exporter; the exact node-placement recursion is mirrored line-for-line so
   the two can't quietly drift apart.
   ========================================================================== */

function fatherOf(pid) {
  const p = byId.get(pid);
  const fam = p && p.parentFamilyId && famById.get(p.parentFamilyId);
  return (fam && fam.husbandId && byId.get(fam.husbandId)) || null;
}
function motherOf(pid) {
  const p = byId.get(pid);
  const fam = p && p.parentFamilyId && famById.get(p.parentFamilyId);
  return (fam && fam.wifeId && byId.get(fam.wifeId)) || null;
}
function parentsOf(pid) { return [fatherOf(pid), motherOf(pid)].filter(Boolean); }
/* Chronological, first union first — spouseFamilyIds/childIds already carry
   that order from the exporter (Family.chronologyKey / orderedChildren), so
   there's no ordering logic to re-implement here, unlike the Mac app's
   spouseFamiliesOrdered which computes it against live Core Data. */
function spouseFamiliesOf(pid) {
  const p = byId.get(pid);
  return ((p && p.spouseFamilyIds) || []).map(fid => famById.get(fid)).filter(Boolean);
}
function childrenOfPerson(pid) {
  const kids = [];
  for (const fam of spouseFamiliesOf(pid)) for (const cid of (fam.childIds || [])) kids.push(cid);
  return kids;
}

const ExplorerMetrics = {
  cardWidth: 170, cardHeight: 54, columnStep: 200, rowStep: 120, pad: 40,
  minZoom: 0.15, maxZoom: 2,
  canvasSize(layout) {
    const rows = layout.maxGeneration - layout.minGeneration;
    return { width: layout.columns * this.columnStep + 2 * this.pad,
             height: rows * this.rowStep + this.cardHeight + 2 * this.pad };
  },
  clamp(z) { return Math.min(Math.max(z, this.minZoom), this.maxZoom); },
  step(z) { return Math.max(0.05, z * 0.25); },
  fit(canvas, viewport) {
    if (viewport.width <= 1 || viewport.height <= 1 || canvas.width <= 1 || canvas.height <= 1) return 1;
    return this.clamp(Math.min(viewport.width / canvas.width, viewport.height / canvas.height, 1));
  },
};

/* Builds the hourglass for `focusPersonId`: ancestors fanning up (generation
   < 0), descendants fanning down (generation > 0), a person shown expanded
   only if their id is in `expandedUp`/`expandedDown`. Descendants are placed
   per FAMILY, not per person — a partner is drawn beside their co-parent and
   that family's children hang beneath the couple — so a child never appears
   to descend from one parent alone with no clue who the other was, and
   someone with children by two partners gets one card per partner with the
   right children under each. Faithful port of FamilyExplorer.build; see that
   file for the reasoning behind each step. */
function buildExplorerLayout(focusPersonId, expandedUp, expandedDown) {
  const nodeById = new Map();
  const edges = [];
  let nextId = 0;

  // ---- Ancestor pass (also creates the focus node at generation 0) ----
  let upLeaf = 0;
  function placeUp(pid, generation, visited) {
    const parents = parentsOf(pid).filter(pp => !visited.has(pp.id));
    const show = expandedUp.has(pid) && parents.length > 0;
    let x;
    const childIds = [];
    if (show) {
      const seen = new Set(visited); seen.add(pid);
      const xs = [];
      for (const parent of parents) {
        const r = placeUp(parent.id, generation - 1, seen);
        childIds.push(r.id); xs.push(r.x);
      }
      x = xs.reduce((a, b) => a + b, 0) / xs.length;
    } else {
      x = upLeaf; upLeaf += 1;
    }
    const id = nextId++;
    nodeById.set(id, {
      id, personId: pid, generation, x,
      isFocus: generation === 0, isSpouse: false,
      hasParents: parentsOf(pid).length > 0,
      hasChildren: childrenOfPerson(pid).length > 0,
    });
    for (const c of childIds) edges.push({ from: id, to: c });
    return { id, x };
  }
  const rootPlaced = placeUp(focusPersonId, 0, new Set());
  const focusNodeId = rootPlaced.id, focusX = rootPlaced.x;

  // ---- Descendant pass (does not re-create the focus; aligns under it) ----
  let downLeaf = 0;
  const downIds = [];

  /* Draws a card for each partner and hangs each family's children beneath
     the partner they were had with. Returns the column `personId_`'s own
     card should occupy, just left of their first partner. */
  function placeFamilies(personId_, nodeId, generation, seen, includeChildren, includeChildlessPartners) {
    function visibleKids(fam) {
      return includeChildren ? (fam.childIds || []).filter(cid => !seen.has(cid)) : [];
    }
    function visiblePartner(fam) {
      const partnerId = fam.husbandId === personId_ ? fam.wifeId : fam.husbandId;
      return (partnerId && !seen.has(partnerId)) ? partnerId : null;
    }
    const drawable = spouseFamiliesOf(personId_).filter(fam =>
      visibleKids(fam).length > 0 || (includeChildlessPartners && visiblePartner(fam)));

    // Children first, family by family, so each family's children stay a
    // contiguous run of columns.
    const startLeaf = downLeaf;
    const groups = []; // { partnerId, kidIds, kidCentres }
    for (const fam of drawable) {
      const kidIds = [], kidCentres = [];
      for (const kidId of visibleKids(fam)) {
        const r = placeDown(kidId, generation + 1, seen);
        kidIds.push(r.id); kidCentres.push(r.centre);
      }
      groups.push({ partnerId: visiblePartner(fam), kidIds, kidCentres });
    }

    // The person and every partner form one adjacent block centred over all
    // the children, so a second partner's card can't fling clear across the
    // chart once the first family's descendants are expanded.
    const partnerCount = groups.filter(g => g.partnerId).length;
    const blockWidth = 1 + partnerCount;
    const allCentres = groups.flatMap(g => g.kidCentres);
    let x;
    if (allCentres.length === 0) {
      x = downLeaf; downLeaf += blockWidth;
    } else {
      if (downLeaf - startLeaf < blockWidth) downLeaf = startLeaf + blockWidth;
      const centre = allCentres.reduce((a, b) => a + b, 0) / allCentres.length;
      x = Math.max(startLeaf, Math.min(centre - (blockWidth - 1) / 2, downLeaf - blockWidth));
    }

    // Attribution lives in the edges: each child links to the partner they
    // were had with, so two families read as distinct fans even though the
    // partner cards sit side by side.
    let offset = 1;
    for (const g of groups) {
      if (!g.partnerId) {
        for (const c of g.kidIds) edges.push({ from: nodeId, to: c });
        continue;
      }
      const sid = nextId++;
      downIds.push(sid);
      nodeById.set(sid, {
        id: sid, personId: g.partnerId, generation,
        x: x + offset, isFocus: false, isSpouse: true,
        hasParents: parentsOf(g.partnerId).length > 0,
        hasChildren: childrenOfPerson(g.partnerId).length > 0,
      });
      edges.push({ from: nodeId, to: sid });                    // marriage bar
      for (const c of g.kidIds) edges.push({ from: sid, to: c }); // …and their children
      offset += 1;
    }
    return x;
  }

  /* Places `personId_` and, when expanded, everything hanging below them. */
  function placeDown(personId_, generation, visited) {
    const seen = new Set(visited); seen.add(personId_);
    // Claim the id up front so this person's own children can link back to it.
    const id = nextId++;
    downIds.push(id);

    let x;
    if (expandedDown.has(personId_)) {
      x = placeFamilies(personId_, id, generation, seen, true, false);
    } else {
      x = downLeaf; downLeaf += 1;
    }

    const remainingKids = childrenOfPerson(personId_).filter(cid => !seen.has(cid));
    nodeById.set(id, {
      id, personId: personId_, generation, x,
      isFocus: false, isSpouse: false,
      hasParents: parentsOf(personId_).length > 0,
      hasChildren: remainingKids.length > 0,
    });
    return { id, centre: x };
  }

  // The focus goes through the same routine as everyone else, so "which
  // children with whom" reads identically at every level. Its partners still
  // show even when childless — long-standing focus-only behaviour.
  const focusDownX = placeFamilies(focusPersonId, focusNodeId, 0, new Set([focusPersonId]),
                                    expandedDown.has(focusPersonId), true);
  // Slide the whole descendant block so it lines up under the column the
  // ancestor pass already fixed for the focus.
  const delta = focusX - focusDownX;
  for (const id of downIds) { nodeById.get(id).x += delta; }

  // Normalise so the leftmost column is 0.
  const minX = Math.min(...[...nodeById.values()].map(n => n.x));
  for (const n of nodeById.values()) n.x -= minX;

  // ---- Group the downward edges into one bracket per family ----
  const kidsByParent = new Map();
  for (const e of edges) {
    const ga = nodeById.get(e.from).generation, gb = nodeById.get(e.to).generation;
    if (ga === gb) continue;
    const parent = ga < gb ? e.from : e.to, child = ga < gb ? e.to : e.from;
    if (!kidsByParent.has(parent)) kidsByParent.set(parent, []);
    kidsByParent.get(parent).push(child);
  }
  /* The horizontal extent a bracket needs — its children plus the parent. */
  function spanOf(parentId) {
    const xs = (kidsByParent.get(parentId) || []).map(id => nodeById.get(id).x);
    xs.push(nodeById.get(parentId).x);
    return [Math.min(...xs), Math.max(...xs)];
  }
  const brackets = [];
  const byGeneration = new Map();
  for (const pid of kidsByParent.keys()) {
    const gen = nodeById.get(pid).generation;
    if (!byGeneration.has(gen)) byGeneration.set(gen, []);
    byGeneration.get(gen).push(pid);
  }
  for (const [generation, parents] of byGeneration) {
    const ordered = [...parents].sort((a, b) => (spanOf(a)[0] - spanOf(b)[0]) || (a - b));
    // Ancestors never need lanes: a father and a mother both lead to the same
    // child, so separating them would imply a distinction that isn't there.
    if (generation < 0) {
      for (const p of ordered) brackets.push({ id: p, children: [...kidsByParent.get(p)].sort((a, b) => a - b), lane: 0 });
      continue;
    }
    // Greedy interval assignment: a family only leaves lane 0 when its span
    // actually overlaps one already placed there.
    const laneEnd = [];
    for (const p of ordered) {
      const [lo, hi] = spanOf(p);
      let assigned = laneEnd.findIndex(e => e < lo);
      if (assigned === -1) { assigned = laneEnd.length; laneEnd.push(hi); }
      else laneEnd[assigned] = hi;
      brackets.push({ id: p, children: [...kidsByParent.get(p)].sort((a, b) => a - b), lane: assigned });
    }
  }
  brackets.sort((a, b) => a.id - b.id);

  const nodes = [...nodeById.values()].sort((a, b) => a.id - b.id);
  const gens = nodes.map(n => n.generation);
  return {
    nodes, edges, brackets,
    minGeneration: Math.min(...gens),
    maxGeneration: Math.max(...gens),
    columns: Math.max(...nodes.map(n => n.x)) + 1,
  };
}

/* Which branches are open, surviving a re-centre — the JS twin of
   ExplorerExpansion. Kept as a plain module-level object, separate from
   rendering, for the same reason the Swift original is a plain value type
   held on AppState rather than view @State: re-centring on a neighbour
   should keep the picture you built up, not collapse it. Sets are keyed by
   PERSON id (tree.json ids), not by the layout's own per-build node ids. */
const explorerState = {
  up: new Set(), down: new Set(), lastFocus: null,
  /* Re-centre on `id`: keep every branch already open, and expand the new
     focus both ways — the long-standing default view. No-op if `id` is
     already the focus, so merely revisiting Explore won't undo a collapse. */
  focus(id) {
    if (id === this.lastFocus) return;
    this.lastFocus = id;
    this.up.add(id); this.down.add(id);
  },
  toggleUp(id) { this.up.has(id) ? this.up.delete(id) : this.up.add(id); },
  toggleDown(id) { this.down.has(id) ? this.down.delete(id) : this.down.add(id); },
  isExpandedUp(id) { return this.up.has(id); },
  isExpandedDown(id) { return this.down.has(id); },
  collapseAll(id) { this.up = new Set([id]); this.down = new Set([id]); this.lastFocus = id; },
  openBranchCount(id) {
    let n = 0;
    for (const x of this.up) if (x !== id) n++;
    for (const x of this.down) if (x !== id) n++;
    return n;
  },
};

let explorerZoom = 1;
let currentExploreFocus = null;
let wheelCommitTimer = null;

/* Sits just outside the card, touching its edge, rather than straddling it —
   a two-line wrapped name (a long given name, or the focus card's thicker
   border eating into its content width) can run close enough to the edge
   that a handle centred ON the border would land on top of the text. */
function handleHtml(dir, personId, expanded, centerX, edgeY) {
  const size = 26;
  const top = dir === "up" ? edgeY - size : edgeY;
  const glyph = expanded ? '<path d="M3 7h8"/>' : '<path d="M7 3v8M3 7h8"/>';
  return '<button type="button" class="xhandle' + (expanded ? " expanded" : "") + '" ' +
    'style="left:' + (centerX - size / 2) + 'px; top:' + top + 'px;" ' +
    'data-' + dir + '="' + esc(personId) + '" title="' + (expanded ? "Collapse" : "Expand") + '">' +
    '<svg viewBox="0 0 14 14" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">' +
    glyph + '</svg></button>';
}

/* Redraws the explorer at the current focus/expansion/zoom. Doesn't touch
   the route — card taps navigate via location.hash (so they're a normal
   history entry and reflect what's centred), but expand/collapse and zoom
   are transient view state, exactly like the native toolbar/@State. */
function renderExplorer() {
  const focusId = currentExploreFocus;
  explorerState.focus(focusId);
  const layout = buildExplorerLayout(focusId, explorerState.up, explorerState.down);
  const canvas = ExplorerMetrics.canvasSize(layout);
  const viewportEl = document.getElementById("exploreViewport");
  const viewport = { width: viewportEl.clientWidth, height: viewportEl.clientHeight };
  const fit = ExplorerMetrics.fit(canvas, viewport);
  const zoom = explorerZoom;
  const openBranches = explorerState.openBranchCount(focusId);
  const focusPerson = byId.get(focusId);

  document.getElementById("exploreToolbar").innerHTML =
    '<span class="explore-focus">Centred on <b>' + esc(fullName(focusPerson)) + '</b></span>' +
    '<span class="explore-hint">Tap a card to go there · ⊕ / ⊖ to expand or collapse</span>' +
    '<span class="spacer"></span>' +
    '<button class="xbtn" type="button" data-cmd="collapse"' + (openBranches === 0 ? " disabled" : "") + '>Collapse</button>' +
    '<button class="xbtn" type="button" data-cmd="zoom-out"' + (zoom <= ExplorerMetrics.minZoom + 0.001 ? " disabled" : "") + '>−</button>' +
    '<button class="xbtn zoomPctBtn" type="button" id="zoomPct" data-cmd="zoom-reset">' + Math.round(zoom * 100) + '%</button>' +
    '<button class="xbtn" type="button" data-cmd="zoom-in"' + (zoom >= ExplorerMetrics.maxZoom - 0.001 ? " disabled" : "") + '>+</button>' +
    '<button class="xbtn" type="button" data-cmd="fit"' + (fit >= 0.999 ? " disabled" : "") + '>Fit</button>';

  const m = ExplorerMetrics;
  function centreOf(node) {
    return {
      x: m.pad + node.x * m.columnStep + m.cardWidth / 2,
      y: m.pad + (node.generation - layout.minGeneration) * m.rowStep + m.cardHeight / 2,
    };
  }
  const centres = new Map(layout.nodes.map(n => [n.id, centreOf(n)]));
  const gen = new Map(layout.nodes.map(n => [n.id, n.generation]));

  // Everything is one path, stroked once, so overlaps can't build up density
  // the way separate strokes did.
  let d = "";
  for (const e of layout.edges) {
    if (gen.get(e.from) !== gen.get(e.to)) continue;
    const a = centres.get(e.from), b = centres.get(e.to);
    if (!a || !b) continue;
    // Marriage bar: connect the cards' facing edges, not their centres, so
    // the line only spans the gap and never crosses a box.
    const left = a.x <= b.x ? a : b, right = a.x <= b.x ? b : a;
    d += "M" + (left.x + m.cardWidth / 2) + "," + left.y + "L" + (right.x - m.cardWidth / 2) + "," + right.y + " ";
  }
  for (const b of layout.brackets) {
    const p = centres.get(b.id);
    const kidPts = b.children.map(id => centres.get(id)).filter(Boolean);
    if (!p || !kidPts.length) continue;
    const top = { x: p.x, y: p.y + m.cardHeight / 2 };
    const kidTopY = kidPts[0].y - m.cardHeight / 2;
    // Stagger only as far as collisions demand; lane 0 keeps the familiar
    // mid-gap turn.
    const fraction = Math.min(0.34 + 0.20 * b.lane, 0.86);
    const busY = top.y + (kidTopY - top.y) * fraction;
    d += "M" + top.x + "," + top.y + "L" + top.x + "," + busY + " ";
    const xs = kidPts.map(k => k.x).concat([top.x]);
    d += "M" + Math.min(...xs) + "," + busY + "L" + Math.max(...xs) + "," + busY + " ";
    for (const k of kidPts) d += "M" + k.x + "," + busY + "L" + k.x + "," + (k.y - m.cardHeight / 2) + " ";
  }

  const cardsHtml = layout.nodes.map(node => {
    const p = byId.get(node.personId);
    const c = centres.get(node.id);
    const left = c.x - m.cardWidth / 2, top = c.y - m.cardHeight / 2;
    const showUp = !node.isSpouse && node.generation <= 0 && node.hasParents;
    const showDown = !node.isSpouse && node.generation >= 0 && node.hasChildren;
    const cls = "xcard" + (node.isFocus ? " focus" : "") + (node.isSpouse ? " spouse" : "");
    let html = '<button type="button" class="' + cls + '" style="left:' + left + 'px; top:' + top + 'px; ' +
      'width:' + m.cardWidth + 'px; height:' + m.cardHeight + 'px;" data-nav="' + esc(p.id) + '">' +
      '<span class="bar ' + (sexClass(p) || "") + '"></span>' +
      '<span class="mono sm ' + sexClass(p) + '">' + esc(initials(p)) + '</span>' +
      '<span class="xinfo"><span class="xname">' + esc(fullName(p)) + '</span>' +
      (years(p) ? '<span class="xyears">' + esc(years(p)) + '</span>' : "") + '</span></button>';
    if (showUp) html += handleHtml("up", p.id, explorerState.isExpandedUp(p.id), c.x, top);
    if (showDown) html += handleHtml("down", p.id, explorerState.isExpandedDown(p.id), c.x, top + m.cardHeight);
    return html;
  }).join("");

  document.getElementById("exploreCanvas").innerHTML =
    '<svg class="explore-lines" width="' + canvas.width + '" height="' + canvas.height + '">' +
    '<path d="' + d + '" fill="none" stroke="var(--connector)" stroke-width="1.5"/></svg>' + cardsHtml;

  const sizer = document.getElementById("exploreSizer");
  const inner = document.getElementById("exploreCanvas");
  inner.style.width = canvas.width + "px";
  inner.style.height = canvas.height + "px";
  sizer.style.width = (canvas.width * zoom) + "px";
  sizer.style.height = (canvas.height * zoom) + "px";
  inner.style.transform = "scale(" + zoom + ")";
}

function touchDistance(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy);
}

/* Live-updates just the canvas transform during a pinch/wheel gesture,
   skipping the full re-render so it stays smooth; the gesture's end commits
   the value via a normal renderExplorer() (which also refreshes the zoom-%
   toolbar button). Mirrors the native GestureState-onto-committed-zoom split. */
function applyLiveZoom(zoom) {
  explorerZoom = zoom;
  const sizer = document.getElementById("exploreSizer");
  const inner = document.getElementById("exploreCanvas");
  const w = parseFloat(inner.style.width), h = parseFloat(inner.style.height);
  sizer.style.width = (w * zoom) + "px";
  sizer.style.height = (h * zoom) + "px";
  inner.style.transform = "scale(" + zoom + ")";
  const pct = document.getElementById("zoomPct");
  if (pct) pct.textContent = Math.round(zoom * 100) + "%";
}

function wireExplorer() {
  const el = document.getElementById("explore");
  el.addEventListener("click", e => {
    const nav = e.target.closest("[data-nav]");
    if (nav) { location.hash = "explore/" + nav.dataset.nav; return; }
    const up = e.target.closest("[data-up]");
    if (up) { explorerState.toggleUp(up.dataset.up); renderExplorer(); return; }
    const down = e.target.closest("[data-down]");
    if (down) { explorerState.toggleDown(down.dataset.down); renderExplorer(); return; }
    const cmd = e.target.closest("[data-cmd]");
    if (!cmd || cmd.disabled) return;
    if (cmd.dataset.cmd === "collapse") { explorerState.collapseAll(currentExploreFocus); renderExplorer(); return; }
    if (cmd.dataset.cmd === "zoom-out") explorerZoom = ExplorerMetrics.clamp(explorerZoom - ExplorerMetrics.step(explorerZoom));
    else if (cmd.dataset.cmd === "zoom-in") explorerZoom = ExplorerMetrics.clamp(explorerZoom + ExplorerMetrics.step(explorerZoom));
    else if (cmd.dataset.cmd === "zoom-reset") explorerZoom = 1;
    else if (cmd.dataset.cmd === "fit") {
      const layout = buildExplorerLayout(currentExploreFocus, explorerState.up, explorerState.down);
      const canvas = ExplorerMetrics.canvasSize(layout);
      const viewportEl = document.getElementById("exploreViewport");
      explorerZoom = ExplorerMetrics.fit(canvas, { width: viewportEl.clientWidth, height: viewportEl.clientHeight });
    }
    renderExplorer();
  });

  const viewportEl = document.getElementById("exploreViewport");
  let pinchStartDist = null, pinchStartZoom = 1;
  viewportEl.addEventListener("touchstart", e => {
    if (e.touches.length === 2) { pinchStartDist = touchDistance(e.touches); pinchStartZoom = explorerZoom; }
  }, { passive: true });
  viewportEl.addEventListener("touchmove", e => {
    if (e.touches.length === 2 && pinchStartDist) {
      e.preventDefault();
      applyLiveZoom(ExplorerMetrics.clamp(pinchStartZoom * (touchDistance(e.touches) / pinchStartDist)));
    }
  }, { passive: false });
  const commitPinch = () => { if (pinchStartDist) { pinchStartDist = null; renderExplorer(); } };
  viewportEl.addEventListener("touchend", commitPinch);
  viewportEl.addEventListener("touchcancel", commitPinch);

  // Trackpad pinch on a desktop browser arrives as a wheel event with ctrlKey set.
  viewportEl.addEventListener("wheel", e => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    applyLiveZoom(ExplorerMetrics.clamp(explorerZoom - e.deltaY * 0.01));
    clearTimeout(wheelCommitTimer);
    wheelCommitTimer = setTimeout(renderExplorer, 150);
  }, { passive: false });

  window.addEventListener("resize", () => {
    if (document.body.classList.contains("explore-mode")) renderExplorer();
  });
}

function showExplore(id) {
  const p = byId.get(id) || byId.get(TREE.rootPersonId) || TREE.people[0];
  currentId = p.id;
  if (currentExploreFocus !== p.id) explorerZoom = 1;
  currentExploreFocus = p.id;
  document.body.classList.add("explore-mode");
  document.getElementById("topTitle").textContent = fullName(p) + " — Explore";
  document.getElementById("viewToggle").textContent = "Details";
  document.getElementById("viewToggle").onclick = () => { location.hash = p.id; };
  document.title = fullName(p) + " — " + TREE.treeName;
  renderExplorer();
  document.getElementById("detail").scrollTop = 0;
  renderSidebar();
}

/* ---- Routing ------------------------------------------------------------ */

let currentId = null;

function show(id) {
  const p = byId.get(id) || byId.get(TREE.rootPersonId) || TREE.people[0];
  currentId = p.id;
  document.body.classList.remove("explore-mode");
  const sheet = document.getElementById("sheet");
  sheet.innerHTML =
    renderHeader(p) + renderStory(p) + renderTimeline(p) +
    renderMedia(p) + renderFamily(p) + renderSources(p) + renderFooter();
  hydrateMedia(sheet);
  document.getElementById("detail").scrollTop = 0;
  document.title = fullName(p) + " — " + TREE.treeName;
  document.getElementById("topTitle").textContent = TREE.treeName;
  document.getElementById("viewToggle").textContent = "Explore family";
  document.getElementById("viewToggle").onclick = () => { location.hash = "explore/" + p.id; };
  renderSidebar();
}

function routeFromHash() {
  const hash = (location.hash || "").replace(/^#/, "");
  if (hash.indexOf("explore/") === 0) { showExplore(hash.slice(8) || TREE.rootPersonId); return; }
  show(hash || TREE.rootPersonId);
}

/* A bundle from a newer exporter is refused loudly rather than half-rendered. */
function guard() {
  if (TREE.schemaVersion === SUPPORTED_SCHEMA) return false;
  document.querySelector(".app").innerHTML =
    '<div class="guard"><h2>This bundle is a newer format</h2>' +
    '<p>It was written as schema v' + esc(TREE.schemaVersion) + ', and this viewer reads v' +
    SUPPORTED_SCHEMA + '. Update the viewer, or re-export from the Mac app.</p></div>';
  return true;
}

/* ============================================================================
   Import — file picker → unzip (in-page, no library) → IndexedDB.
   A `.familyweb` is an ordinary zip (tree.json + img/*.jpg), written by the
   Mac app's `--export-web` via `/usr/bin/zip`. Parsed here with nothing more
   than DataView + DecompressionStream, both built into iPad Safari.
   ========================================================================== */

const DB_NAME = "familyweb-viewer", DB_VERSION = 1;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains("kv")) db.createObjectStore("kv");
      if (!db.objectStoreNames.contains("media")) db.createObjectStore("media");
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbGet(db, store, key) {
  return new Promise((resolve, reject) => {
    const req = db.transaction(store, "readonly").objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbPutAll(db, store, pairs) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, "readwrite");
    const os = tx.objectStore(store);
    for (const [k, v] of pairs) os.put(v, k);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
function idbClear(db, store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, "readwrite");
    tx.objectStore(store).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

/* Loads whatever was imported on a previous visit, if anything. */
async function loadStoredBundle() {
  try {
    const db = await openDB();
    const tree = await idbGet(db, "kv", "tree");
    if (!tree) return null;
    return { tree, importedAt: await idbGet(db, "kv", "importedAt") };
  } catch (e) {
    console.warn("IndexedDB unavailable, skipping stored bundle:", e);
    return null;
  }
}

/* Full replace, matching the schema's "no incremental sync" contract. */
async function storeBundle(tree, mediaEntries) {
  const db = await openDB();
  const importedAt = new Date().toISOString();
  await idbClear(db, "media");
  if (mediaEntries.length) await idbPutAll(db, "media", mediaEntries);
  await idbPutAll(db, "kv", [["tree", tree], ["importedAt", importedAt]]);
  return importedAt;
}

async function inflateRaw(bytes) {
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}

/* Walks the archive's directory table (not a streaming read of local entries)
   — its sizes are authoritative and its offsets let each entry's data be
   sliced directly, matching how `/usr/bin/zip` writes the file. Returns
   Map<path, Uint8Array>; directory entries are skipped. */
async function parseZip(buf) {
  const view = new DataView(buf), bytes = new Uint8Array(buf);
  const EOCD_SIG = 0x06054b50, CD_SIG = 0x02014b50, LOCAL_SIG = 0x04034b50;

  let eocd = -1;
  const scanFrom = Math.max(0, bytes.length - 22 - 65535);
  for (let i = bytes.length - 22; i >= scanFrom; i--) {
    if (view.getUint32(i, true) === EOCD_SIG) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error("Not a .familyweb bundle (no zip end-of-directory record)");

  const entryCount = view.getUint16(eocd + 10, true);
  const out = new Map();
  let p = view.getUint32(eocd + 16, true);
  for (let i = 0; i < entryCount; i++) {
    if (view.getUint32(p, true) !== CD_SIG) throw new Error("Malformed bundle (bad directory table)");
    const method = view.getUint16(p + 10, true);
    const compSize = view.getUint32(p + 20, true);
    const uncompSize = view.getUint32(p + 24, true);
    const nameLen = view.getUint16(p + 28, true);
    const extraLen = view.getUint16(p + 30, true);
    const commentLen = view.getUint16(p + 32, true);
    const localOffset = view.getUint32(p + 42, true);
    const name = new TextDecoder().decode(bytes.subarray(p + 46, p + 46 + nameLen));
    p += 46 + nameLen + extraLen + commentLen;
    if (name.endsWith("/") || (compSize === 0 && uncompSize === 0)) continue;

    if (view.getUint32(localOffset, true) !== LOCAL_SIG) throw new Error("Malformed bundle (bad entry: " + name + ")");
    const lNameLen = view.getUint16(localOffset + 26, true);
    const lExtraLen = view.getUint16(localOffset + 28, true);
    const dataStart = localOffset + 30 + lNameLen + lExtraLen;
    const compressed = bytes.subarray(dataStart, dataStart + compSize);

    if (method === 0) out.set(name, compressed);
    else if (method === 8) out.set(name, await inflateRaw(compressed));
    else throw new Error("Unsupported compression in bundle entry: " + name);
  }
  return out;
}

function mimeFor(name) {
  if (/\.jpe?g$/i.test(name)) return "image/jpeg";
  if (/\.png$/i.test(name)) return "image/png";
  return "application/octet-stream";
}

function setImportStatus(message, isError) {
  const el = document.getElementById("importStatus");
  el.textContent = message;
  el.classList.toggle("error", !!isError);
}

async function importBundle(file) {
  const btn = document.getElementById("importBtn");
  btn.disabled = true;
  setImportStatus("Importing " + file.name + "…", false);
  try {
    const entries = await parseZip(await file.arrayBuffer());
    const treeBytes = entries.get("tree.json");
    if (!treeBytes) throw new Error("No tree.json inside this file — is it a .familyweb bundle?");
    const tree = JSON.parse(new TextDecoder().decode(treeBytes));
    if (tree.schemaVersion !== SUPPORTED_SCHEMA) {
      throw new Error("This bundle is schema v" + tree.schemaVersion + "; this viewer reads v" +
        SUPPORTED_SCHEMA + ". Re-export from the Mac app.");
    }

    const mediaEntries = [];
    for (const [name, data] of entries) {
      if (name === "tree.json") continue;
      mediaEntries.push([name, new Blob([data], { type: mimeFor(name) })]);
    }
    const importedAt = await storeBundle(tree, mediaEntries);
    // A re-import fully replaces the "media" store (storeBundle already
    // cleared it), so any blob: URLs already handed to <img> tags now point
    // at nothing — drop the resolver cache so the next render re-resolves
    // against the new bundle instead of an object URL from the old one.
    for (const src of mediaCache.values()) { if (src.startsWith("blob:")) URL.revokeObjectURL(src); }
    mediaCache.clear();

    applyTree(tree, false, importedAt);
    renderApp();
    setImportStatus("Imported " + tree.people.length.toLocaleString() + " people from “" +
      tree.treeName + "”.", false);
  } catch (e) {
    console.error(e);
    setImportStatus("Import failed — " + e.message, true);
  } finally {
    btn.disabled = false;
  }
}

/* ---- Boot -----------------------------------------------------------------
   Priority: a bundle imported on a previous visit (IndexedDB) → a `tree.json`
   served beside this page (dev convenience, http only — file:// can't fetch a
   sibling file) → the fictional fixture. The Import button always works
   regardless of which of these got the app started, and re-importing is a
   full replace, same as the schema's "no incremental sync" rule. */
let importedAt = null;

function applyTree(tree, sample, importedAtIso) {
  TREE = tree;
  isSample = sample;
  importedAt = importedAtIso || null;
  byId    = new Map(TREE.people.map(p => [p.id, p]));
  famById = new Map(TREE.families.map(f => [f.id, f]));
  srcById = new Map(TREE.sources.map(s => [s.id, s]));
}

function wireUI() {
  const body = document.body;
  const narrow = window.matchMedia("(max-width:700px)");
  // Wide screens collapse the in-flow column; narrow screens slide an overlay in.
  document.getElementById("menuBtn").addEventListener("click", () => {
    body.classList.toggle(narrow.matches ? "nav-open" : "nav-collapsed");
  });
  document.getElementById("scrim").addEventListener("click", () => body.classList.remove("nav-open"));
  document.getElementById("peopleNav").addEventListener("click", e => {
    if (e.target.closest(".prow") && narrow.matches) body.classList.remove("nav-open");
  });
  document.getElementById("searchBox").addEventListener("input", renderSidebar);
  window.addEventListener("hashchange", routeFromHash);
  wireExplorer();
  wireLightbox();

  const fileInput = document.getElementById("importFile");
  document.getElementById("importBtn").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];
    fileInput.value = ""; // allow re-picking the same filename later
    if (file) importBundle(file);
  });
}

function renderApp() {
  if (guard()) return;
  document.getElementById("treeName").textContent = TREE.treeName;
  document.getElementById("topTitle").textContent = TREE.treeName;
  document.getElementById("treeSub").textContent =
    TREE.people.length.toLocaleString() + " people · read-only";
  routeFromHash();
}

async function boot() {
  wireUI();

  const stored = await loadStoredBundle();
  if (stored) { applyTree(stored.tree, false, stored.importedAt); renderApp(); return; }

  let loaded = null;
  try {
    const res = await fetch("./tree.json", { cache: "no-store" });
    if (res.ok) loaded = await res.json();
  } catch (e) { /* no bundle beside us — expected on the published shell */ }
  if (loaded) { applyTree(loaded, false, null); renderApp(); return; }

  applyTree(FIXTURE, true, null);
  renderApp();
}

boot();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    // updateViaCache: "none" forces the browser to bypass HTTP cache when
    // checking sw.js for updates. Without it, GitHub Pages' own caching
    // (Cache-Control: max-age=600) can leave a browser comparing against a
    // stale cached copy of sw.js forever, so it never notices a real change
    // and no update ever installs — no amount of reloading the PAGE fixes
    // that, since it's the update CHECK itself that's stuck.
    navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" })
      .catch(() => { /* offline shell is a nicety, not a requirement */ });
  });
}
</script>
</body>
